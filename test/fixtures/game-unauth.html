<!doctype html>
<html lang="zh-CN">
<!--
  test/fixtures/game-unauth.html
  游戏域名未登录页 fixture。已由真实本机采集确认(2026-08-05,scripts/capture-game-baseline.mjs
  或直接 fetch 得到的真实页面结构)。核心契约:
    <button class="join" id="joinBtn">LinuxDO 登录</button>
  并保留真实页面里会干扰选择器的"诱饵"按钮(#mobileJoinBtn"登录"、#leaveBtn"离开"、
  #chatSendBtn"发送"等),确保 findLinuxDoLoginButton 只命中 #joinBtn。
  已脱敏:不含游戏脚本、Cookie、token 或凭据。
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>囤囤鼠历险记</title>
</head>
<body>
  <section class="block">
    <div class="block-title"><span>Entity Control</span></div>
    <div class="control-grid">
      <input id="userId" inputmode="numeric" value="" placeholder="LinuxDO 登录后写入" aria-label="User ID" readonly>
      <button class="join" id="joinBtn">LinuxDO 登录</button>
      <button class="leave" id="leaveBtn">离开</button>
    </div>
  </section>
  <!-- 诱饵:文本"登录/发送/离开",但都不是登录入口 -->
  <button class="join mobile-auth" id="mobileJoinBtn" type="button">登录</button>
  <button class="leave mobile-auth" id="mobileLeaveBtn" type="button">退出</button>
  <button id="chatSendBtn">发送</button>
  <button id="helpOkBtn">知道了</button>
</body>
</html>
